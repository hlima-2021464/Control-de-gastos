<section class="construction-page" aria-label="Página en construcción">
  <div class="construction-card">

    <!-- Ícono animado de construcción -->
    <div class="construction-icon" aria-hidden="true">
      <!-- Engranaje animado -->
      <svg class="gear gear-main" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83
                 M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
      </svg>
      <!-- Engranaje pequeño secundario -->
      <svg class="gear gear-small" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83
                 M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
      </svg>
    </div>

    <!-- Título -->
    <h2 class="construction-title">En Construcción</h2>

    <!-- Mensaje exacto requerido -->
    <p class="construction-message">
      Esta pagina actualmente se encuentra en fase de construcion...
    </p>

    <!-- Barra de progreso animada decorativa -->
    <div class="progress-bar" aria-hidden="true">
      <div class="progress-fill"></div>
    </div>

    <p class="construction-hint">Próximamente disponible</p>

  </div>
</section>
